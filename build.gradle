plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev'
    id 'io.freefair.lombok' version '9.0.0'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            // Round 18: also enable AE2's GameTest namespace so that any AE2 test instances present
            // on the runtime classpath run inside the ExpandedAE dev environment. NOTE (measured):
            // AE2's 85 test plots live in AE2's *test* source set and are therefore NOT in the
            // published appliedenergistics2 jar, so only the 1 vanilla/NeoForge test instance is
            // discovered here. Kept because it costs nothing and will pick up AE2 tests
            // automatically if they are ever shipped in the main artifact.
            systemProperty 'neoforge.enabledGameTestNamespaces', "ae2,${project.mod_id}"
        }
        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// ---------------------------------------------------------------------------
// Round 16: integrations whose dependency has NO proven 26.1.2 artifact.
// Excluded from compilation rather than stubbed (brief section 12).
// ---------------------------------------------------------------------------
sourceSets.main.java {
    exclude 'lu/kolja/expandedae/xmod/megacells/**'          // MEGA Cells: no 26.1.2 artifact
}

dependencies {
    // --- core AE2 stack -----------------------------------------------------
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    implementation "org.appliedenergistics:guideme:${guideme_version}"

    // --- AE2WTLib (REQUIRED per neoforge.mods.toml) -------------------------
    jarJar(implementation("de.mari_023:ae2wtlib_api:${ae2wtlib_version}") { transitive = false })
    compileOnly("de.mari_023:ae2wtlib:${ae2wtlib_version}") { transitive = false }
    runtimeOnly("de.mari_023:ae2wtlib:${ae2wtlib_version}") { transitive = false }

    // --- glodblock ecosystem -------------------------------------------------
    implementation "io.github.glodblock:Glodium:${glodium_version}"
    implementation "curse.maven:ex-pattern-provider-892005:${ex_pattern_file_id}"   // ExtendedAE
    // AppliedFlux. Split into compileOnly + gated runtimeOnly so that BOTH branches of
    // MixinPlugin can actually be startup-tested (Round 18): with AppliedFlux present the plugin
    // selects compat.appflux.AppFluxMixinPatternProvider{Logic,Menu,Screen} and *disables* the
    // patternprovider.* trio; without it the reverse. `-PnoAppFlux` runs the second configuration.
    compileOnly "curse.maven:applied-flux-965012:${applied_flux_file_id}"
    if (!project.hasProperty('noAppFlux')) {
        runtimeOnly "curse.maven:applied-flux-965012:${applied_flux_file_id}"
    }

    // --- AdvancedAE ----------------------------------------------------------
    implementation "curse.maven:advancedae-1084104:${advancedae_file_id}"
    // Round 18: AdvancedAE hard-requires geckolib; without it FML aborts before mod loading, which
    // would make every runtime gate (datagen / dedicated server / client) impossible to run.
    runtimeOnly "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // --- item list mod (API only at compile time) ---------------------------
    // Fleet policy: EMI only (JEI integration removed). Built locally into mavenLocal.
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version    : neo_version,
            neoforge_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version         : mod_version, mod_authors: mod_authors,
            mod_description     : mod_description,
            ae2_version_range   : ae2_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Round 18: javac's default cap of 100 diagnostics hid a whole second layer of errors behind
// the first wave of "cannot find symbol". Raise it so error counts in the port report are honest.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xmaxerrs', '9999'])
}

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
